<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Offline - CampusKey</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #F8FAFC;
      color: #0F172A;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 24px 28px;
      text-align: center;
    }
    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      width: 32px;
      height: 32px;
      background: #1F6B4A;
      color: white;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #1F6B4A;
      letter-spacing: -0.5px;
    }
    .content {
      max-width: 340px;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: auto 0;
    }
    .icon-container {
      width: 84px;
      height: 84px;
      background: #EAF4EE;
      color: #1F6B4A;
      border-radius: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      box-shadow: 0 10px 25px -5px rgba(31, 107, 74, 0.15);
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      color: #0F172A;
      margin-bottom: 10px;
      letter-spacing: -0.4px;
    }
    p {
      font-size: 14px;
      color: #64748B;
      line-height: 1.5;
      margin-bottom: 28px;
    }
    .btn-retry {
      background: #1F6B4A;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 12px;
      border: none;
      width: 100%;
      box-shadow: 0 4px 14px rgba(31, 107, 74, 0.25);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }
    .btn-retry:hover {
      background: #18583D;
    }
    .btn-retry:active {
      transform: scale(0.98);
    }
    .support-card {
      background: #ffffff;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 14px 18px;
      width: 100%;
      margin-top: 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
    }
    .support-icon {
      width: 38px;
      height: 38px;
      background: #F1F5F9;
      color: #475569;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .support-text h4 {
      font-size: 12px;
      font-weight: 700;
      color: #64748B;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .support-text p {
      font-size: 13px;
      font-weight: 600;
      color: #0F172A;
      margin: 0;
    }
    .footer {
      font-size: 12px;
      color: #94A3B8;
      font-weight: 500;
    }
    .spin {
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Brand Header -->
  <div class="brand-header">
    <div class="brand-icon">
      <!-- House / Key vector icon -->
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
        <polyline points="9 22 9 12 15 12 15 22"/>
      </svg>
    </div>
    <span class="brand-title">CampusKey</span>
  </div>

  <!-- Main Offline Content -->
  <div class="content">
    <div class="icon-container">
      <!-- Clean Wifi-Off Vector SVG -->
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 20h.01"/>
        <path d="M8.5 16.429a5 5 0 0 1 7 0"/>
        <path d="M5 12.859a10 10 0 0 1 5.17-2.69"/>
        <path d="M19 12.859a10 10 0 0 0-2.007-1.523"/>
        <path d="M2 8.82a15 15 0 0 1 4.177-2.643"/>
        <path d="M22 8.82a15 15 0 0 0-11.288-3.764"/>
        <line x1="2" x2="22" y1="2" y2="22"/>
      </svg>
    </div>

    <h1>No Internet Connection</h1>
    <p>We couldn't connect to the server. Please check your Wi-Fi or mobile data network and try again.</p>
    
    <button class="btn-retry" onclick="retryConnection()">
      <svg id="retry-svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/>
        <path d="M21 3v5h-5"/>
      </svg>
      <span id="btn-text">Try Reconnecting</span>
    </button>

    <div class="support-card">
      <div class="support-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
          <path d="M12 17h.01"/>
        </svg>
      </div>
      <div class="support-text">
        <h4>Student Support</h4>
        <p>support@campuskey.co.ke</p>
      </div>
    </div>
  </div>

  <div class="footer">
    CampusKey Mombasa &bull; Offline Mode
  </div>

  <script>
    function retryConnection() {
      var btn = document.querySelector('.btn-retry');
      var svg = document.getElementById('retry-svg');
      var text = document.getElementById('btn-text');

      svg.classList.add('spin');
      text.textContent = 'Connecting...';
      btn.style.opacity = '0.85';
      
      setTimeout(function() {
        window.location.href = 'https://www.campuskey.co.ke/';
      }, 600);
    }

    // Auto-retry when internet comes back
    window.addEventListener('online', function() {
      retryConnection();
    });
  </script>
</body>
</html>
